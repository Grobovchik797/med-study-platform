plugins { id 'com.android.application' }

android {
    namespace 'io.github.grobovchik797.medstudy'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.grobovchik797.medstudy'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.5.2'
        manifestPlaceholders = [appLabel: 'Med Study']
    }

    buildTypes {
        debug {
            // Test APK installs alongside the previous package: no forced
            // uninstall and no accidental deletion of locally saved progress.
            applicationIdSuffix '.preview'
            versionNameSuffix '-test'
            manifestPlaceholders = [appLabel: 'Med Study (тест)']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}

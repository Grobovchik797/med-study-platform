<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-label="Буферные системы крови: связь лёгких и почек">
<rect width="100%" height="100%" fill="#fcfcff"/>
<text x="36" y="54" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#18233b" text-anchor="start">Буферные системы крови: связь лёгких и почек</text>
<rect x="45" y="154" width="990" height="125" rx="18" fill="#eff4fb" stroke="#cbd8ea" stroke-width="1"/>
<text x="540" y="208" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="bold" fill="#1c426b" text-anchor="middle">CO₂ + H₂O  ⇄  H₂CO₃  ⇄  H⁺ + HCO₃⁻</text>
<rect x="60" y="382" width="430" height="131" rx="16" fill="#e7f5f3" stroke="#b7d8d1" stroke-width="1"/>
<text x="275" y="423" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#25665d" text-anchor="middle">Лёгкие</text>
<text x="275" y="462" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#25665d" text-anchor="middle">Удаление CO₂ через вентиляцию</text>
<rect x="585" y="382" width="430" height="131" rx="16" fill="#f7edfd" stroke="#dbcee8" stroke-width="1"/>
<text x="800" y="423" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#6e5086" text-anchor="middle">Почки</text>
<text x="800" y="462" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#6e5086" text-anchor="middle">H⁺-экскреция, баланс HCO₃⁻</text>
<line x1="320" y1="282" x2="320" y2="371" stroke="#307c70" stroke-width="3"/>
<polygon points="320,371 314.78,360.19 325.22,360.19" fill="#307c70"/>
<line x1="760" y1="282" x2="760" y2="371" stroke="#835b9b" stroke-width="3"/>
<polygon points="760,371 754.78,360.19 765.22,360.19" fill="#835b9b"/>
<text x="55" y="579" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#283b58" text-anchor="start">Артериальный pH взрослого: обычно 7,35–7,45</text>
<text x="36" y="626" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#697789" text-anchor="start">Источник референса pH: MedlinePlus (артериальная кровь).</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-label="Наследование ABO: родители AO × BO">
<rect width="100%" height="100%" fill="#fcfcff"/>
<text x="36" y="54" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#18233b" text-anchor="start">Наследование ABO: родители AO × BO</text>
<text x="75" y="130" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#324965" text-anchor="start">Аллели родителя AO → A, O</text>
<text x="75" y="172" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#324965" text-anchor="start">Аллели родителя BO ↓ B, O</text>
<rect x="440" y="180" width="110" height="110" rx="10" fill="#f1f4fa" stroke="#d0d9e8" stroke-width="1"/>
<rect x="555" y="180" width="110" height="110" rx="10" fill="#f1f4fa" stroke="#d0d9e8" stroke-width="1"/>
<rect x="670" y="180" width="110" height="110" rx="10" fill="#f1f4fa" stroke="#d0d9e8" stroke-width="1"/>
<rect x="440" y="295" width="110" height="110" rx="10" fill="#f1f4fa" stroke="#d0d9e8" stroke-width="1"/>
<rect x="555" y="295" width="110" height="110" rx="10" fill="#f1f4fa" stroke="#d0d9e8" stroke-width="1"/>
<rect x="670" y="295" width="110" height="110" rx="10" fill="#f1f4fa" stroke="#d0d9e8" stroke-width="1"/>
<rect x="440" y="410" width="110" height="110" rx="10" fill="#f1f4fa" stroke="#d0d9e8" stroke-width="1"/>
<rect x="555" y="410" width="110" height="110" rx="10" fill="#f1f4fa" stroke="#d0d9e8" stroke-width="1"/>
<rect x="670" y="410" width="110" height="110" rx="10" fill="#f1f4fa" stroke="#d0d9e8" stroke-width="1"/>
<text x="610" y="245" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="bold" fill="#274e87" text-anchor="middle">A</text>
<text x="725" y="245" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="bold" fill="#274e87" text-anchor="middle">O</text>
<text x="495" y="360" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="bold" fill="#274e87" text-anchor="middle">B</text>
<text x="495" y="475" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="bold" fill="#274e87" text-anchor="middle">O</text>
<text x="610" y="360" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#a64e61" text-anchor="middle">AB</text>
<text x="725" y="360" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#a64e61" text-anchor="middle">BO</text>
<text x="610" y="475" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#a64e61" text-anchor="middle">AO</text>
<text x="725" y="475" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#a64e61" text-anchor="middle">OO</text>
<text x="65" y="580" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#25344d" text-anchor="start">Обычная модель: A, B, AB, O — каждый вариант ~25%.</text>
<text x="36" y="626" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#697789" text-anchor="start">Упрощённая схема без редких вариантов, например cis-AB или фенотипа Bombay.</text>
</svg>
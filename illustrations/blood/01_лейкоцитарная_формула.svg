<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-label="Лейкоцитарная формула: ориентиры для взрослых">
<rect width="100%" height="100%" fill="#fcfcff"/>
<text x="36" y="54" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#18233b" text-anchor="start">Лейкоцитарная формула: ориентиры для взрослых</text>
<text x="38" y="156" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#25344d" text-anchor="start">Нейтрофилы</text>
<rect x="270" y="135" width="575" height="30" rx="12" fill="#eef1f7" stroke="#eef1f7" stroke-width="1"/>
<rect x="598.5714285714286" y="135" width="164.28571428571428" height="30" rx="9" fill="#5672bd" stroke="#5672bd" stroke-width="1"/>
<text x="900" y="158" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#1c2d4b" text-anchor="start">40–60 %</text>
<text x="38" y="238" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#25344d" text-anchor="start">Лимфоциты</text>
<rect x="270" y="217" width="575" height="30" rx="12" fill="#eef1f7" stroke="#eef1f7" stroke-width="1"/>
<rect x="434.2857142857143" y="217" width="164.28571428571428" height="30" rx="9" fill="#4d9a93" stroke="#4d9a93" stroke-width="1"/>
<text x="900" y="240" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#1c2d4b" text-anchor="start">20–40 %</text>
<text x="38" y="320" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#25344d" text-anchor="start">Моноциты</text>
<rect x="270" y="299" width="575" height="30" rx="12" fill="#eef1f7" stroke="#eef1f7" stroke-width="1"/>
<rect x="286.42857142857144" y="299" width="49.285714285714285" height="30" rx="9" fill="#9e7cbe" stroke="#9e7cbe" stroke-width="1"/>
<text x="900" y="322" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#1c2d4b" text-anchor="start">2–8 %</text>
<text x="38" y="402" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#25344d" text-anchor="start">Эозинофилы</text>
<rect x="270" y="381" width="575" height="30" rx="12" fill="#eef1f7" stroke="#eef1f7" stroke-width="1"/>
<rect x="278.2142857142857" y="381" width="24.642857142857142" height="30" rx="9" fill="#cd8756" stroke="#cd8756" stroke-width="1"/>
<text x="900" y="404" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#1c2d4b" text-anchor="start">1–4 %</text>
<text x="38" y="484" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#25344d" text-anchor="start">Базофилы</text>
<rect x="270" y="463" width="575" height="30" rx="12" fill="#eef1f7" stroke="#eef1f7" stroke-width="1"/>
<rect x="274.10714285714283" y="463" width="4.107142857142857" height="30" rx="9" fill="#ad6b96" stroke="#ad6b96" stroke-width="1"/>
<text x="900" y="486" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#1c2d4b" text-anchor="start">0,5–1 %</text>
<text x="38" y="595" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#25344d" text-anchor="start">Палочкоядерные нейтрофилы: ориентир 0–3%, входят в нейтрофилы.</text>
<text x="36" y="626" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#697789" text-anchor="start">Источник интервалов: MedlinePlus. В другой лаборатории интервалы могут отличаться.</text>
</svg>
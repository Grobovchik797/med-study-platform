<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="t d">
<title id="t">Гистологическая схема тонкой кишки: ворсинки и крипты</title>
<desc id="d">Схема: ворсинки с энтероцитами и бокаловидными клетками, кишечные крипты с клетками Панета, собственная пластинка слизистой, мышечная пластинка, подслизистая основа. Не настоящий препарат.</desc>

<text x="820" y="134" font-weight="700">Ворсинка</text><text x="820" y="158" font-size="15">Вырост слизистой оболочки</text>
<text x="820" y="199" font-weight="700">Бокаловидная клетка</text><text x="820" y="224" font-size="15">Муцины → слизь</text>
<text x="820" y="268" font-weight="700">Энтероцит</text><text x="820" y="294" font-size="15">Щёточная каёмка, всасывание</text>

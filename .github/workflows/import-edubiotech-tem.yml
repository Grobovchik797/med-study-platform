name: Import EduBiotech digestive TEM originals
on:
  push:
    branches:
      - feat/edubiotech-original-images-1-9-8
    paths:
      - scripts/import_edubiotech_tem.py
      - .github/workflows/import-edubiotech-tem.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edubiotech-original-images-1-9-8
      - name: Install microscopy parser
        run: python3 -m pip install --quiet Pillow beautifulsoup4
      - name: Fetch original attributed electron micrographs
        run: python3 -u scripts/import_edubiotech_tem.py
      - name: Commit verified original image bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/edubiotech-tem data/gi-edubiotech-tem.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(gi): add original EduBiotech digestive TEM and source labels"
            git fetch origin feat/edubiotech-original-images-1-9-8
            git rebase origin/feat/edubiotech-original-images-1-9-8
            git push origin HEAD:feat/edubiotech-original-images-1-9-8
          fi

name: Build Android APK (test version)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "Android SDK: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate atlas and static learning content
        run: |
          python3 scripts/validate_questions.py
          python3 scripts/validate_illustrations.py
          python3 scripts/validate_atlas.py
          python3 scripts/validate_subjects.py
          node --check app.js
      - name: Prepare embedded offline website
        run: |
          python3 scripts/generate_icons.py
          python3 scripts/package_android_assets.py
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: med-study-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

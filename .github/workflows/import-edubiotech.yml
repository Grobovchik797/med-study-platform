name: Import permitted original EduBiotech illustrations
on:
  push:
    branches:
      - feat/edubiotech-original-images-1-9-8
    paths:
      - scripts/import_edubiotech_original.py
      - .github/workflows/import-edubiotech.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edubiotech-original-images-1-9-8
          persist-credentials: true
      - name: Install parsing and image verification
        run: python3 -m pip install --quiet beautifulsoup4 Pillow
      - name: Import original licensed-for-study specimens and annotations
        run: python3 -u scripts/import_edubiotech_original.py
      - name: Commit source-attributed photographs to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gi-edubiotech-original.json photos/edubiotech
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "assets(gi): import source-attributed EduBiotech microscopy and exact marker coordinates"
            git fetch origin feat/edubiotech-original-images-1-9-8
            git rebase origin/feat/edubiotech-original-images-1-9-8
            git push origin HEAD:feat/edubiotech-original-images-1-9-8
          fi

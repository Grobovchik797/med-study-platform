name: Validate and publish Med Study

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate question data
        run: |
          python3 scripts/validate_questions.py
          python3 scripts/validate_subjects.py
          python3 scripts/validate_histology.py
          python3 scripts/validate_library.py
          python3 scripts/validate_small_intestine_pilot.py
          python3 scripts/validate_gi_curriculum.py
      - name: Generate installable app icons
        run: python3 scripts/generate_icons.py
      - name: Validate PWA assets and manifest
        run: |
          python3 scripts/validate_pwa.py
          python3 scripts/validate_illustrations.py
      - name: Download and verify original licensed microscopy photographs
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/prepare_histology_photos.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check small-intestine-interact.js
          node --check gi-course.js
          node --check sw.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          python3 scripts/generate_icons.py
          python3 -m pip install --quiet Pillow
          python3 scripts/prepare_histology_photos.py
          mkdir -p _site/data _site/icons _site/illustrations _site/photos
          cp index.html styles.css app.js small-intestine-interact.js gi-course.js sw.js manifest.webmanifest .nojekyll _site/
          cp data/gi-department-questions.json data/gi-curriculum.json data/gi-inline-quiz.json data/gi-final-quiz.json data/gi-workbook.json _site/data/
          cp data/questions.json data/lesson.json data/atlas.json data/subjects.json data/histology-small-intestine.json data/library.json data/small-intestine-quiz.json data/small-intestine-slides.json _site/data/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          cp illustrations/*.svg _site/illustrations/
          cp photos/*.jpg _site/photos/
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

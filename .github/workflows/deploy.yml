name: Validate and publish Med Study

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate question data
        run: |
          python3 scripts/validate_questions.py
          python3 scripts/validate_subjects.py
          python3 scripts/validate_histology.py
          python3 scripts/validate_library.py
          python3 scripts/validate_cranial_nerves.py
          python3 scripts/validate_blood_course.py
          python3 scripts/validate_small_intestine_pilot.py
          python3 scripts/validate_gi_curriculum.py
          python3 scripts/validate_study_tools.py
          python3 scripts/validate_colloquium_guide.py
          python3 scripts/validate_external_atlas.py
          python3 scripts/validate_edubiotech_original.py
          python3 scripts/validate_edubiotech_tem.py
          python3 scripts/validate_lecture_crosswalk.py
          python3 scripts/validate_department_public.py
          python3 -m py_compile scripts/verify_public_site.py
      - name: Generate installable app icons
        run: python3 scripts/generate_icons.py
      - name: Validate PWA assets and manifest
        run: |
          python3 scripts/validate_pwa.py
          python3 scripts/validate_illustrations.py
      # Reuse only images compiled for these exact licensed source manifests.
      # The preparation script still decodes every cached JPEG before accepting it.
      - name: Restore verified microscopy image cache
        uses: actions/cache@v4
        with:
          path: photos/*.jpg
          key: ${{ runner.os }}-medstudy-histology-v1-${{ hashFiles('data/small-intestine-slides.json', 'data/gi-atlas.json', 'scripts/prepare_histology_photos.py') }}
      - name: Download and verify original licensed microscopy photographs
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/prepare_histology_photos.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check small-intestine-interact.js
          node --check gi-course.js
          node --check cranial-nerves.js
          node --check blood-study.js
          node --check study-tools.js
          node --check department-atlas.js
          node --check department-public.js
          node --check edubiotech-atlas.js
          node --check edubiotech-original.js
          node --check sw.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Reuse the validated image cache from the previous job on this commit.
      - name: Restore verified microscopy image cache
        uses: actions/cache@v4
        with:
          path: photos/*.jpg
          key: ${{ runner.os }}-medstudy-histology-v1-${{ hashFiles('data/small-intestine-slides.json', 'data/gi-atlas.json', 'scripts/prepare_histology_photos.py') }}
      - name: Prepare website files
        run: |
          python3 scripts/generate_icons.py
          python3 -m pip install --quiet Pillow
          python3 scripts/prepare_histology_photos.py
          mkdir -p _site/data _site/icons _site/illustrations _site/photos
          cp index.html styles.css app.js small-intestine-interact.js gi-course.js cranial-nerves.js study-tools.js department-atlas.js department-public.js edubiotech-atlas.js edubiotech-original.js blood-study.js blood-study.css sw.js manifest.webmanifest .nojekyll _site/
          cp data/gi-deep-a.json data/gi-deep-b.json data/gi-department-questions.json data/gi-curriculum.json data/cranial-nerves.json data/cranial-nerves-viii-xii.json data/gi-inline-quiz.json data/gi-final-quiz.json data/gi-answer-reasons.json data/update-journal.json data/gi-colloquium-guide.json data/gi-edubiotech-atlas.json data/gi-edubiotech-original.json data/gi-edubiotech-tem.json data/gi-workbook.json data/gi-atlas.json data/department-public.json data/gi-department-reference-map.json _site/data/
          cp data/physiology-blood.json data/physiology-blood-exam.json data/physiology-blood-atlas.json _site/data/
          cp data/questions.json data/lesson.json data/atlas.json data/subjects.json data/histology-small-intestine.json data/library.json data/small-intestine-quiz.json data/small-intestine-slides.json _site/data/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          cp illustrations/*.svg _site/illustrations/
          cp -R illustrations/blood _site/illustrations/
          cp photos/*.jpg _site/photos/
          cp -R photos/department _site/photos/
          cp -R photos/edubiotech _site/photos/
          cp -R photos/edubiotech-tem _site/photos/
          test -f _site/photos/edubiotech-tem/enterocyte-tem.jpg
          test -f _site/photos/edubiotech-tem/bile-canaliculus-tem.jpg
          test -f _site/photos/edubiotech-tem/pancreas-acinar-tem.jpg
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published version and core assets on GitHub Pages
        run: python3 scripts/verify_public_site.py

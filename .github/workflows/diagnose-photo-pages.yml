name: Diagnose live 1.9.8 photo paths
on:
  pull_request:
    paths:
      - scripts/check_public_image_urls.py
      - .github/workflows/diagnose-photo-pages.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check public GitHub Pages image URLs
        run: python3 -u scripts/check_public_image_urls.py

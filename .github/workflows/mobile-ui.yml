name: Mobile interaction smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      # Reuse only images compiled for these exact licensed source manifests.
      # The preparation script still decodes every cached JPEG before accepting it.
      - name: Restore verified microscopy image cache
        uses: actions/cache@v4
        with:
          path: photos/*.jpg
          key: ${{ runner.os }}-medstudy-histology-v1-${{ hashFiles('data/small-intestine-slides.json', 'data/gi-atlas.json', 'scripts/prepare_histology_photos.py') }}
      - name: Generate icons and start local web server
        run: |
          python3 scripts/generate_icons.py
          python3 -m pip install --quiet Pillow
          python3 scripts/prepare_histology_photos.py
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/med-study-test-server.log 2>&1 &
      - name: Test mobile interactions (browser and Android origin)
        run: |
          node tests/mobile-smoke.cjs
          node tests/blood-smoke.cjs


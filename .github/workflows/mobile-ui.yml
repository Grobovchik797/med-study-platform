name: Mobile interaction smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate icons and start local web server
        run: |
          python3 scripts/generate_icons.py
          python3 -m pip install --quiet Pillow
          python3 scripts/prepare_histology_photos.py
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/med-study-test-server.log 2>&1 &
      - name: Temporary microscope review thumbnails (remove before release)
        run: |
          python3 - <<'PY'
          import json,base64,io
          from pathlib import Path
          from PIL import Image
          slides=json.loads(Path('data/gi-atlas.json').read_text('utf-8'))['images']
          for slide in slides:
              if slide['id'] not in {'tooth-enamel-organ','gastro-esophageal-junction','pyloric-stomach','esophagus-cross-section','tongue-foliate','tongue-filiform','palatine-tonsil','parotid-gland','mixed-salivary-gland','tooth-dentin-enamel'}:continue
              with Image.open(slide['src'][2:]) as im:
                  im.thumbnail((720,600))
                  out=io.BytesIO()
                  im.convert('RGB').save(out,format='JPEG',quality=65)
                  print('ATLAS_REVIEW:'+slide['id']+':'+base64.b64encode(out.getvalue()).decode())
          PY
      - name: Test mobile interactions (browser and Android origin)
        run: node tests/mobile-smoke.cjs

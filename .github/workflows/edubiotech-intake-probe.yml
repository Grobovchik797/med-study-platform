name: Probe source EM captions and figure links
on:
  push:
    branches: [feat/edubiotech-full-images-1-9-8-intake]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant original EduBiotech chapter figures
        run: python3 scripts/probe_edubiotech_em.py

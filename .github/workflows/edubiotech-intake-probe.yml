name: Probe EduBiotech original atlas availability
on:
  push:
    branches: [feat/edubiotech-full-images-1-9-8-intake]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original specimen images and captions
        run: python3 scripts/probe_edubiotech_marks.py
      - name: Probe archive HTTPS from GitHub runner
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,socket,re,html
          host="edubiotech.ru"
          print("DNS status:",end=" ")
          try:print(socket.getaddrinfo(host,443)[0][4][0])
          except Exception as ex:print(type(ex).__name__,str(ex)[:180])
          urls=[
           "https://edubiotech.ru/images/vetfac/images/ebooks/histology/index.htm",
           "https://edubiotech.ru/images/vetfac/images/ebooks/histology/histology/r6frames.htm",
           "https://edubiotech.ru/images/vetfac/images/ebooks/histology/histology/R5/S23lst.html",
           "https://edubiotech.ru/images/vetfac/images/ebooks/histology/histology/R5/S24lst.html",
           "https://edubiotech.ru/images/vetfac/images/ebooks/histology/histology/R5/S25lst.html",
           "https://djvu.online/file/v61x96JGoawh9",
          ]
          for url in urls:
           try:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; MedStudy-EduBiotech-permissioned-course-intake/1.0)"})
            with urllib.request.urlopen(req,timeout=10) as resp:
             data=resp.read(180000)
             print("OK",resp.status,resp.geturl(),"bytes",len(data),"type",resp.headers.get('Content-Type'))
             text=data.decode("cp1251",errors="replace")
             links=re.findall(r"""(?:src|href)\s*=\s*["']([^"']+)""",text,re.I)
             print("SAMPLE-LINKS",links[:25])
             print("SAMPLE-TITLES",re.findall(r"<title[^>]*>(.{3,130}?)</title>",text,re.I|re.S)[:3])
           except Exception as ex:print("FAIL",url,type(ex).__name__,str(ex)[:180])
          PY
